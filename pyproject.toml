[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scanflow"
version = "0.1.0"
description = "Semi-automated STM control and drift-corrected measurement portal for CreaTec instruments"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.6",
    "matplotlib==3.9.2",
    "numpy==1.26.3",
    "openai-clip==1.0.1",
    "opencv-python==4.10.0.84",
    "pillow==10.2.0",
    "scipy==1.13.1",
    "torch==2.7.1",
    "torchvision==0.22.1",
    "scikit-learn==1.6.1",
    "scikit-image>=0.21",
    "pyqtgraph>=0.13",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
createc = ["pywin32>=306"]   # Windows-only, CreaTec COM interface
dev = ["pytest", "pytest-qt", "ruff"]

[project.scripts]
scanflow = "scanflow.gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scanflow*"]

[tool.ruff]
line-length = 100
